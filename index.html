<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .form-container {
      max-width: 400px;
      margin: 0 auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>Submit Your Information</h1>
  <div class="form-container">
    <form id="emailForm">
      <input type="text" id="name" name="name" placeholder="Your Name" required><br>
      <input type="text" id="needed_thing" name="needed_thing" placeholder="What do you need?" required><br>
      <input type="email" id="email" name="email" placeholder="Your Email Address" required><br>
      <input type="email" id="confirm_email" name="confirm_email" placeholder="Confirm Email Address" required><br>
      <button type="submit">Submit</button>
    </form>
    <p id="responseMessage"></p>
  </div>

  <!-- Include the EmailJS JavaScript SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="text/javascript">
    (function() {
      emailjs.init("OoQi5-N99oSSYjhh9");  // Replace with your actual EmailJS public user ID
    })();

    document.getElementById("emailForm").addEventListener("submit", function(event) {
      event.preventDefault();

      var name = document.getElementById("name").value;
      var neededThing = document.getElementById("needed_thing").value;
      var email = document.getElementById("email").value;
      var confirmEmail = document.getElementById("confirm_email").value;

      if (email !== confirmEmail) {
        document.getElementById("responseMessage").textContent = "Email addresses do not match. Please try again.";
        return;
      }

      var submitButton = document.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      var templateParams = {
        name: name,
        needed_thing: neededThing,
        to_email: `${email}, agarwalaudvik@gmail.com`  // 🔹 Sends email to both user & you
      };

      emailjs.send("service_gtweha7", "template_mj32895", templateParams)
        .then(function(response) {
          document.getElementById("responseMessage").textContent = "Emails sent successfully!";
        })
        .catch(function(error) {
          document.getElementById("responseMessage").textContent = "Error sending emails.";
        })
        .finally(function() {
          submitButton.disabled = false;
          submitButton.textContent = "Submit";
        });
    });
  </script>
</body>
</html>
